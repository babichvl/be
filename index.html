<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>FitnessPro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ───── Tabs ───── -->
  <div class="app">

    <!-- Schedule Tab -->
    <section class="tab active" id="tab-schedule">
      <header class="page-header">
        <h1 class="page-title">Расписание</h1>
        <div class="view-switcher">
          <button class="view-btn active" data-view="day">День</button>
          <button class="view-btn" data-view="week">Неделя</button>
          <button class="view-btn" data-view="month">Месяц</button>
        </div>
      </header>

      <!-- Date navigation -->
      <div class="date-nav">
        <button class="nav-arrow" id="prev-period">&#8249;</button>
        <span class="period-label" id="period-label"></span>
        <button class="nav-arrow" id="next-period">&#8250;</button>
      </div>

      <!-- Week strip (day/week views) -->
      <div class="week-strip" id="week-strip"></div>

      <!-- Calendar body -->
      <div class="calendar-body" id="calendar-body"></div>
    </section>

    <!-- Clients Tab (stub) -->
    <section class="tab" id="tab-clients">
      <header class="page-header"><h1 class="page-title">Клиенты</h1></header>
      <p class="stub-text">Скоро</p>
    </section>

    <!-- Programs Tab (stub) -->
    <section class="tab" id="tab-programs">
      <header class="page-header"><h1 class="page-title">Программы</h1></header>
      <p class="stub-text">Скоро</p>
    </section>

    <!-- Home Tab (stub) -->
    <section class="tab" id="tab-home">
      <header class="page-header"><h1 class="page-title">Главная</h1></header>
      <p class="stub-text">Скоро</p>
    </section>

    <!-- FAB -->
    <button class="fab" id="fab-add" aria-label="Добавить тренировку">+</button>

    <!-- Bottom nav -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="schedule" aria-label="Расписание">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.8" fill="none"/><line x1="3" y1="9" x2="21" y2="9" stroke="currentColor" stroke-width="1.8"/><line x1="8" y1="2" x2="8" y2="6" stroke="currentColor" stroke-width="1.8"/><line x1="16" y1="2" x2="16" y2="6" stroke="currentColor" stroke-width="1.8"/></svg>
        <span>Расписание</span>
      </button>
      <button class="nav-item" data-tab="clients" aria-label="Клиенты">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
        <span>Клиенты</span>
      </button>
      <button class="nav-item" data-tab="programs" aria-label="Программы">
        <svg viewBox="0 0 24 24"><path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-6.5 4 2-7L2 9h7z" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
        <span>Программы</span>
      </button>
      <button class="nav-item" data-tab="home" aria-label="Главная">
        <svg viewBox="0 0 24 24"><path d="M3 12L12 3l9 9" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 10v10a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1V10" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
        <span>Главная</span>
      </button>
    </nav>
  </div>

  <!-- ───── Modal: Add / Edit session ───── -->
  <div class="modal-overlay" id="modal-add" role="dialog" aria-modal="true" aria-label="Новая тренировка">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <h2 class="modal-title" id="modal-add-title">Новая тренировка</h2>

      <form id="form-session" novalidate>
        <input type="hidden" id="f-session-id" />

        <div class="field">
          <label for="f-client">Клиент</label>
          <select id="f-client" required>
            <option value="">— выберите клиента —</option>
          </select>
        </div>

        <div class="field">
          <label for="f-type">Тип</label>
          <select id="f-type">
            <option value="personal">Персональная</option>
            <option value="group">Групповая</option>
            <option value="online">Онлайн</option>
            <option value="intro">Вводная</option>
          </select>
        </div>

        <div class="field">
          <label for="f-date">Дата</label>
          <input type="date" id="f-date" required />
        </div>

        <div class="field row">
          <div class="field-half">
            <label for="f-time">Время начала</label>
            <input type="time" id="f-time" required />
          </div>
          <div class="field-half">
            <label for="f-duration">Длительность (мин)</label>
            <input type="number" id="f-duration" value="60" min="15" max="480" />
          </div>
        </div>

        <div class="field" id="field-online-link" style="display:none">
          <label for="f-link">Ссылка на встречу</label>
          <input type="url" id="f-link" placeholder="https://meet.jit.si/..." />
          <small class="field-hint">Оставьте пустым — сгенерируется автоматически</small>
        </div>

        <div class="field">
          <label for="f-cost">Стоимость (₽, необязательно)</label>
          <input type="number" id="f-cost" min="0" placeholder="0" />
        </div>

        <div class="field">
          <label for="f-repeat">Повторение</label>
          <select id="f-repeat">
            <option value="none">Без повторения</option>
            <option value="daily">Ежедневно (30 дней)</option>
            <option value="weekly">Еженедельно (4 недели)</option>
            <option value="custom">По дням недели</option>
          </select>
        </div>

        <div class="field" id="field-days" style="display:none">
          <label>Дни недели</label>
          <div class="day-chips">
            <label class="day-chip"><input type="checkbox" value="0" /><span>Пн</span></label>
            <label class="day-chip"><input type="checkbox" value="1" /><span>Вт</span></label>
            <label class="day-chip"><input type="checkbox" value="2" /><span>Ср</span></label>
            <label class="day-chip"><input type="checkbox" value="3" /><span>Чт</span></label>
            <label class="day-chip"><input type="checkbox" value="4" /><span>Пт</span></label>
            <label class="day-chip"><input type="checkbox" value="5" /><span>Сб</span></label>
            <label class="day-chip"><input type="checkbox" value="6" /><span>Вс</span></label>
          </div>
        </div>

        <div class="conflict-warning" id="conflict-warning" style="display:none">
          ⚠️ В это время уже есть другая тренировка. Проверьте расписание.
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-ghost" id="btn-cancel-add">Отмена</button>
          <button type="submit" class="btn-primary" id="btn-save-session">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ───── Modal: Session detail ───── -->
  <div class="modal-overlay" id="modal-detail" role="dialog" aria-modal="true" aria-label="Тренировка">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="detail-header">
        <span class="detail-status-badge" id="d-status-badge"></span>
        <h2 class="modal-title" id="d-title"></h2>
      </div>
      <div class="detail-row"><span class="detail-label">Клиент</span><span id="d-client"></span></div>
      <div class="detail-row"><span class="detail-label">Тип</span><span id="d-type"></span></div>
      <div class="detail-row"><span class="detail-label">Дата и время</span><span id="d-datetime"></span></div>
      <div class="detail-row"><span class="detail-label">Длительность</span><span id="d-duration"></span></div>
      <div class="detail-row" id="d-row-link" style="display:none">
        <span class="detail-label">Ссылка</span>
        <a id="d-link" href="#" target="_blank" rel="noopener">Открыть встречу</a>
      </div>
      <div class="detail-row" id="d-row-cost" style="display:none">
        <span class="detail-label">Стоимость</span><span id="d-cost"></span>
      </div>

      <div class="detail-actions" id="detail-actions"></div>

      <!-- Reschedule sub-form -->
      <div id="reschedule-form" style="display:none" class="reschedule-form">
        <div class="field row">
          <div class="field-half"><label for="rs-date">Новая дата</label><input type="date" id="rs-date" /></div>
          <div class="field-half"><label for="rs-time">Время</label><input type="time" id="rs-time" /></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-ghost" id="btn-rs-cancel">Отмена</button>
          <button type="button" class="btn-primary" id="btn-rs-save">Сохранить</button>
        </div>
      </div>

      <button class="btn-ghost full-width" id="btn-close-detail">Закрыть</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
