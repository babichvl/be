<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>FitCoach</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <!-- Фиксированная шапка -->
  <header class="topbar">
    <div class="topbar__spacer"></div>
    <h1 class="topbar__title" id="page-title">Home</h1>
    <button class="topbar__menu-btn" id="menu-btn" aria-label="Меню">⋮</button>
  </header>

  <!-- Дропдаун меню -->
  <div class="dropdown" id="dropdown" hidden>
    <button class="dropdown__item">Профиль</button>
    <button class="dropdown__item">Настройки</button>
  </div>

  <!-- Контент -->
  <main class="content">

    <!-- Экран: Главная -->
    <section class="screen active" id="screen-home">
      <div class="greeting card">
        <div class="avatar" aria-label="Аватар">
          <!-- Иллюстрированный аватар-заглушка -->
          <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="40" cy="80" r="26" fill="#C9B8F0"/>
            <circle cx="40" cy="30" r="16" fill="#F5C9A0"/>
            <ellipse cx="40" cy="28" rx="14" ry="9" fill="#7B4F2E"/>
            <circle cx="40" cy="31" r="13" fill="#F5C9A0"/>
            <circle cx="35" cy="31" r="1.5" fill="#5A3A1A"/>
            <circle cx="45" cy="31" r="1.5" fill="#5A3A1A"/>
            <path d="M36 37 Q40 41 44 37" stroke="#D4826A" stroke-width="1.2" fill="none" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="greeting__text">
          <span class="greeting__hello">HELLO</span>
          <span class="greeting__name">Babich Vlad</span>
        </div>
      </div>

      <div class="calendar-strip card">
        <div class="calendar-strip__header">
          <button class="calendar-strip__arrow" id="cal-prev" aria-label="Предыдущий месяц">‹</button>
          <span class="calendar-strip__month" id="cal-month"></span>
          <button class="calendar-strip__arrow" id="cal-next" aria-label="Следующий месяц">›</button>
        </div>
        <div class="calendar-strip__days" id="cal-days" role="list"></div>
      </div>
    </section>

    <!-- Экран: Расписание -->
    <section class="screen" id="screen-schedule">
      <p class="placeholder-text">Расписание — скоро</p>
    </section>

    <!-- Экран: Клиенты -->
    <section class="screen" id="screen-clients">
      <p class="placeholder-text">Клиенты — скоро</p>
    </section>

    <!-- Экран: Тренировки -->
    <section class="screen" id="screen-workouts">
      <p class="placeholder-text">Тренировки — скоро</p>
    </section>

  </main>

  <!-- Нижняя навигация -->
  <nav class="bottomnav" aria-label="Навигация">
    <button class="bottomnav__item" data-tab="schedule" aria-label="Расписание">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <path d="M16 2v4M8 2v4M3 10h18"/>
      </svg>
      <span class="bottomnav__label">Расписание</span>
    </button>

    <button class="bottomnav__item" data-tab="clients" aria-label="Клиенты">
      <span class="nav-icon-wrap">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="9" cy="7" r="4"/>
          <path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
          <circle cx="18" cy="8" r="3"/>
          <path d="M21 21v-1.5a3 3 0 0 0-2-2.83"/>
        </svg>
        <span class="nav-dot" aria-hidden="true"></span>
      </span>
      <span class="bottomnav__label">Клиенты</span>
    </button>

    <!-- FAB по центру -->
    <button class="bottomnav__fab" id="fab-btn" aria-label="Добавить">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" aria-hidden="true">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>

    <button class="bottomnav__item" data-tab="workouts" aria-label="Тренировки">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      <span class="bottomnav__label">Тренировки</span>
    </button>

    <button class="bottomnav__item active" data-tab="home" aria-label="Главная">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9.5z"/>
        <path d="M9 21V12h6v9"/>
      </svg>
      <span class="bottomnav__label">Главная</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
