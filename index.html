<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymBro - Trainer App</title>
    
    <!-- STYLES -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="clients.css">
    <link rel="stylesheet" href="calendar-scheduler.css">
    <link rel="stylesheet" href="workout-modal.css">
    <link rel="stylesheet" href="trainer-profile.css">
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- HEADER -->
        <header class="header">
            <div class="header-left">
                <h1 class="app-title">GymBro</h1>
            </div>
            <div class="header-right">
                <button class="header-avatar-btn" id="headerAvatarBtn">
                    <div class="avatar-wrapper">
                        <img id="headerAvatar" class="header-avatar" src="" alt="Avatar" />
                        <div class="avatar-status" id="avatarStatus"></div>
                    </div>
                </button>
            </div>
        </header>

        <!-- TABS NAVIGATION -->
        <nav class="tabs-nav">
            <button class="tab-btn active" data-tab="home">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12h18M3 6h18M3 18h18"/>
                </svg>
                <span>Home</span>
            </button>
            <button class="tab-btn" data-tab="schedule">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2"/>
                    <path d="M16 2v4M8 2v4M3 10h18"/>
                </svg>
                <span>Schedule</span>
            </button>
            <button class="tab-btn" data-tab="clients">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                <span>Clients</span>
            </button>
            <button class="tab-btn" data-tab="programs">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z"/>
                </svg>
                <span>Programs</span>
            </button>
        </nav>

        <!-- TAB CONTENTS -->
        <main class="tabs-container">
            <!-- HOME TAB -->
            <section id="home-content" class="tab-content active">
                <div class="home-container">
                    <div class="home-header">
                        <h2>Requires your attention</h2>
                    </div>
                    <div id="triggersContainer" class="triggers-container">
                        <div class="loading">Loading...</div>
                    </div>
                </div>
            </section>

            <!-- SCHEDULE TAB -->
            <section id="schedule-content" class="tab-content">
                <div class="schedule-container">
                    <div class="schedule-header">
                        <div class="schedule-date-nav">
                            <button class="date-nav-btn" id="prevDayBtn">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                    <path d="M15 19l-7-7 7-7" stroke-width="2" stroke-linecap="round"/>
                                </svg>
                            </button>
                            <h2 class="schedule-date" id="currentDate">Today</h2>
                            <button class="date-nav-btn" id="nextDayBtn">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                    <path d="M9 5l7 7-7 7" stroke-width="2" stroke-linecap="round"/>
                                </svg>
                            </button>
                        </div>
                        <button class="add-workout-btn" id="addWorkoutBtn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                            </svg>
                        </button>
                    </div>

                    <div class="schedule-content">
                        <div id="calendarScheduler" class="calendar-grid">
                            <div class="loading">Loading...</div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- CLIENTS TAB -->
            <section id="clients-content" class="tab-content">
                <div class="clients-container">
                    <div class="clients-header">
                        <h2>Clients</h2>
                        <button class="add-client-btn" id="addClientBtn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                            </svg>
                        </button>
                    </div>

                    <div id="clientsList" class="clients-list">
                        <div class="loading">Loading...</div>
                    </div>

                    <!-- TRIGGERS/MESSAGES TAB (под клиентами) -->
                    <div class="messages-section">
                        <h3>Messages</h3>
                        <div id="messagesList" class="messages-list">
                            <div class="loading">Loading...</div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- PROGRAMS TAB -->
            <section id="programs-content" class="tab-content">
                <div class="programs-container">
                    <h2>Programs — soon</h2>
                    <p>Программы будут добавлены позже</p>
                </div>
            </section>
        </main>
    </div>

    <!-- MODALS -->
    <!-- Workout Modal -->
    <div id="workoutModal" class="modal hidden">
        <!-- Modal content generated by workout-modal.js -->
    </div>

    <!-- Add Client Modal -->
    <div id="addClientModal" class="modal hidden">
        <!-- Modal content generated by clients-ui.js -->
    </div>
    <div id="triggersContainer" class="triggers-container hidden"></div>

    <!-- SCRIPTS -->
    <!-- 1. ОСНОВНОЕ -->
    <script src="app.js"></script>

    <!-- 2. STORE'Ы (ДАННЫЕ) -->
    <script src="workouts-store.js"></script>
    <script src="clients-store.js"></script>
    <script src="triggers-store.js"></script>

    <!-- 3. UI (ИНТЕРФЕЙС) -->
    <script src="clients-ui.js"></script>
    <script src="triggers-ui.js"></script>

    <!-- 4. КОМПОНЕНТЫ -->
    <script src="calendar-scheduler.js"></script>
    <script src="workout-modal.js"></script>
    <script src="trainer-profile.js"></script>
    
</body>
</html>
