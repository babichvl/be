<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GymBro</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="calendar-scheduler.css">
  <link rel="stylesheet" href="workout-modal.css">
  <link rel="stylesheet" href="clients.css">
  <link rel="stylesheet" href="home-triggers.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="content">

    <!-- ========================================
         ГЛАВНАЯ
         ======================================== -->
    <div class="screen active" id="screen-home">
      <div class="page-header">
        <h1 class="page-header__title">Главная</h1>
        <div class="page-header__avatar">
          <div class="page-header__avatar-img">В</div>
          <div class="page-header__status"></div>
        </div>
      </div>

<div id="home-calendar__days" class="home-calendar__days" touch-action="none">
  <!-- дни календаря -->
</div>

      <div class="home-expand" id="home-expand">
        <div id="home-list">Загружаем...</div>
      </div>

      <!-- ========================================
           ТРЕБУЕТ ВНИМАНИЯ - Триггеры
           ======================================== -->
      <div class="home-triggers-section">
        <h2 class="home-triggers-title">Требует вашего внимания</h2>
        <div class="home-triggers-carousel" id="home-triggers-carousel">
          <div class="home-triggers-scroll" id="home-triggers-scroll">
            <!-- Карточки триггеров будут добавлены здесь JS -->
          </div>
        </div>
      </div>

    </div>

    <!-- ========================================
         РАСПИСАНИЕ
         ======================================== -->
    <div class="screen" id="screen-schedule">
      <div class="page-header">
        <h1 class="page-header__title">Расписание</h1>
        <div class="page-header__avatar">
          <div class="page-header__avatar-img">В</div>
          <div class="page-header__status"></div>
        </div>
      </div>
      <div id="calendar-scheduler"></div>
    </div>

    <!-- ========================================
         КЛИЕНТЫ
         ======================================== -->
    <div class="screen" id="screen-clients">
      <div class="page-header">
        <h1 class="page-header__title">Клиенты</h1>
        <div class="page-header__avatar">
          <div class="page-header__avatar-img">В</div>
          <div class="page-header__status"></div>
        </div>
      </div>

      <!-- Переключатель подвкладок -->
      <div class="clients-tabs">
        <button class="clients-tab active" data-subtab="list">Клиенты</button>
        <button class="clients-tab" data-subtab="triggers">Сообщения</button>
      </div>

      <!-- Подвкладка: Список клиентов -->
      <div class="clients-subtab active" id="clients-subtab-list">
        <div class="clients-search">
          <input type="text" id="clients-search-input" placeholder="Поиск по имени..." />
        </div>
        <div class="clients-list" id="clients-list">
          <p class="placeholder-text">Загружаем...</p>
        </div>
      </div>

      <!-- Подвкладка: Триггеры -->
      <div class="clients-subtab" id="clients-subtab-triggers">
        <div class="triggers-grid" id="triggers-grid">
          <p class="placeholder-text">Загружаем...</p>
        </div>
      </div>

    </div>

    <!-- ========================================
         ПРОГРАММЫ
         ======================================== -->
    <div class="screen" id="screen-programs">
      <div class="page-header">
        <h1 class="page-header__title">Программы</h1>
        <div class="page-header__avatar">
          <div class="page-header__avatar-img">В</div>
          <div class="page-header__status"></div>
        </div>
      </div>
      <p class="placeholder-text">Программы — скоро</p>
    </div>

  </div>

  <!-- ========================================
       НИЖНЯЯ НАВИГАЦИЯ
       ======================================== -->
  <nav class="bottomnav">
    <button class="bottomnav__item active" data-tab="home">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Главная</span>
    </button>

    <button class="bottomnav__item" data-tab="schedule">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Расписание</span>
    </button>

    <button class="bottomnav__fab" id="fab-btn">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>

    <button class="bottomnav__item" data-tab="clients">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Клиенты</span>
    </button>

    <button class="bottomnav__item" data-tab="programs">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      <span>Программы</span>
    </button>
  </nav>

  <script src="workouts-store.js"></script>
  <script src="clients-store.js"></script>
  <script src="triggers-store.js"></script>
  <script src="calendar-scheduler.js"></script>
  <script src="workout-modal.js"></script>
  <script src="clients-ui.js"></script>
  <script src="triggers-ui.js"></script>
  <script src="home-triggers.js"></script>
  <script src="app.js"></script>
</body>
</html>
