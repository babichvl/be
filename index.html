<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>GymBro</title>
  <link rel="stylesheet" href="style.css?v=9" />
  <link rel="stylesheet" href="calendar-scheduler.css?v=1" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <main class="content">

    <!-- ===== ГЛАВНАЯ ===== -->
    <section class="screen active" id="screen-home">
      <div class="home-header">

        <span class="home-header__title">Главная</span>
        
        <div class="home-header__avatar">
          <div class="home-header__avatar-img" id="home-avatar"></div>
          <span class="home-header__status"></span>
        </div>
      </div>

<div class="home-calendar">
  <!-- Фиксированная рамка с иконкой (выглядит как активный день) -->

  <div class="home-calendar__days" id="home-cal-days">
    <!-- дни генерируются JS -->
  </div>
</div>

      <div class="home-expand" id="home-expand">
        <div class="schedule-list" id="home-list">
          <p class="placeholder-text">Загружаем...</p>
        </div>
      </div>
    </section>

    <!-- ===== РАСПИСАНИЕ ===== -->
    <section class="screen" id="screen-schedule">
      <div class="schedule-header">
        <h1 class="schedule-header__title">Расписание</h1>
        <div class="schedule-header__avatar">
          <div class="schedule-header__avatar-img" id="schedule-avatar"></div>
          <span class="schedule-header__status"></span>
        </div>
      </div>

      <!-- Контейнер для сетки календаря -->
      <div id="calendar-scheduler" class="calendar-scheduler"></div>
    </section>

    <!-- ===== КЛИЕНТЫ ===== -->
    <section class="screen" id="screen-clients">
      <div class="schedule-header">
        <h1 class="schedule-header__title">Клиенты</h1>
      </div>
      <p class="placeholder-text">Клиенты — скоро</p>
    </section>

    <!-- ===== ПРОГРАММЫ ===== -->
    <section class="screen" id="screen-programs">
      <div class="schedule-header">
        <h1 class="schedule-header__title">Программы</h1>
      </div>
      <p class="placeholder-text">Программы — скоро</p>
    </section>

  </main>

  <nav class="bottomnav">

    <button class="bottomnav__item active" data-tab="home">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9.5z"/>
        <path d="M9 21V12h6v9"/>
      </svg>
      <span class="bottomnav__label">Главная</span>
    </button>

    <button class="bottomnav__item" data-tab="schedule">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <path d="M16 2v4M8 2v4M3 10h18"/>
      </svg>
      <span class="bottomnav__label">Расписание</span>
    </button>

    <button class="bottomnav__fab" id="fab-btn" aria-label="Добавить">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>

    <button class="bottomnav__item" data-tab="clients">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="9" cy="7" r="4"/>
        <path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
        <circle cx="18" cy="8" r="3"/>
      </svg>
      <span class="bottomnav__label">Клиенты</span>
    </button>

    <button class="bottomnav__item" data-tab="programs">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M4 19V6a2 2 0 0 1 2-2h13"/>
        <path d="M4 19a2 2 0 0 0 2 2h13V8H6a2 2 0 0 0-2 2v9z"/>
        <line x1="9" y1="12" x2="15" y2="12"/>
        <line x1="9" y1="16" x2="13" y2="16"/>
      </svg>
      <span class="bottomnav__label">Программы</span>
    </button>

  </nav>

  <script src="workouts-store.js?v=9"></script>
  <script src="calendar-scheduler.js?v=1"></script>
  <script src="app.js?v=9"></script>
</body>
</html>
