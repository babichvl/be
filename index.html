<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>GymBro</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header class="topbar">
    <div class="topbar__spacer"></div>
    <h1 class="topbar__title" id="page-title">Главная</h1>
    <button class="topbar__menu-btn" id="menu-btn" aria-label="Меню">⋮</button>
  </header>

  <div class="dropdown" id="dropdown" hidden>
    <button class="dropdown__item">Профиль</button>
    <button class="dropdown__item">Настройки</button>
  </div>

  <main class="content">

  <!-- ===== ГЛАВНАЯ ===== -->
<section class="screen" id="screen-home">
  <div class="home-header">
    <button class="home-header__menu" id="menu-btn-home" aria-label="Меню">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <circle cx="6" cy="6" r="1.5" fill="currentColor"/>
        <circle cx="12" cy="6" r="1.5" fill="currentColor"/>
        <circle cx="6" cy="12" r="1.5" fill="currentColor"/>
        <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
      </svg>
    </button>
    
    <span class="home-header__title">Главная</span>
    
    <div class="home-header__avatar">
      <div class="home-header__avatar-img" id="home-avatar"></div>
      <span class="home-header__status"></span>
    </div>
  </div>

  <div class="home-calendar">
    <div class="home-calendar__days" id="home-cal-days"></div>
  </div>

  <div class="home-expand" id="home-expand">
    <div class="calendar-strip card">
      <div class="calendar-strip__header">
        <button class="calendar-strip__arrow">‹</button>
        <span class="calendar-strip__month" id="cal-month"></span>
        <button class="calendar-strip__arrow">›</button>
      </div>
      <div class="calendar-strip__days" id="cal-days"></div>
    </div>

    <div class="schedule-list" id="home-list">
      <p class="placeholder-text">Загружаем...</p>
    </div>
  </div>
</section>

    <!-- ===== РАСПИСАНИЕ ===== -->
    <section class="screen" id="screen-schedule">
      <div class="calendar-strip card">
        <div class="calendar-strip__header">
          <button class="calendar-strip__arrow">‹</button>
          <span class="calendar-strip__month" id="cal-month-s"></span>
          <button class="calendar-strip__arrow">›</button>
        </div>
        <div class="calendar-strip__days" id="cal-days-s"></div>
      </div>

      <div class="schedule-list" id="schedule-list">
        <p class="placeholder-text">Загружаем...</p>
      </div>
    </section>

    <!-- ===== КЛИЕНТЫ ===== -->
    <section class="screen" id="screen-clients">
      <p class="placeholder-text">Клиенты — скоро</p>
    </section>

    <!-- ===== ПРОГРАММЫ ===== -->
    <section class="screen" id="screen-programs">
      <p class="placeholder-text">Программы — скоро</p>
    </section>

  </main>

  <nav class="bottomnav">

    <button class="bottomnav__item" data-tab="home">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9.5z"/>
        <path d="M9 21V12h6v9"/>
      </svg>
      <span class="bottomnav__label">Главная</span>
    </button>

    <button class="bottomnav__item" data-tab="schedule">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <path d="M16 2v4M8 2v4M3 10h18"/>
      </svg>
      <span class="bottomnav__label">Расписание</span>
    </button>

    <button class="bottomnav__fab" id="fab-btn" aria-label="Добавить">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>

    <button class="bottomnav__item" data-tab="clients">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="9" cy="7" r="4"/>
        <path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
        <circle cx="18" cy="8" r="3"/>
      </svg>
      <span class="bottomnav__label">Клиенты</span>
    </button>

    <button class="bottomnav__item" data-tab="programs">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M4 19V6a2 2 0 0 1 2-2h13"/>
        <path d="M4 19a2 2 0 0 0 2 2h13V8H6a2 2 0 0 0-2 2v9z"/>
        <line x1="9" y1="12" x2="15" y2="12"/>
        <line x1="9" y1="16" x2="13" y2="16"/>
      </svg>
      <span class="bottomnav__label">Программы</span>
    </button>

  </nav>

  <script src="workouts-store.js"></script>
  <script src="app.js"></script>
</body>
</html>
