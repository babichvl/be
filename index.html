<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FitnessPro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <button class="menu-btn" id="menuBtn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="5" cy="5" r="1" fill="currentColor" stroke="none"/>
                    <circle cx="12" cy="5" r="1" fill="currentColor" stroke="none"/>
                    <circle cx="5" cy="12" r="1" fill="currentColor" stroke="none"/>
                    <circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>
                </svg>
            </button>
            <div class="profile-avatar" id="profileAvatar">
                <div class="avatar-inner"></div>
                <div class="avatar-status"></div>
            </div>
        </header>

        <main class="main-content">
            <!-- Общая -->
            <div class="tab-content active" id="tabOverview">
                <h1 class="page-title">Общая</h1>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon">📊</div>
                        <div class="stat-value">12</div>
                        <div class="stat-label">Тренировок</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">👥</div>
                        <div class="stat-value">8</div>
                        <div class="stat-label">Клиентов</div>
                    </div>
                </div>
                <div class="section-card">
                    <h3 class="section-title">Сегодня</h3>
                    <p class="empty-state">Нет запланированных тренировок</p>
                </div>
            </div>

            <!-- Расписание -->
            <div class="tab-content" id="tabSchedule">
                <h1 class="page-title">Расписание</h1>
                <div class="calendar-strip">
                    <div class="date-item">
                        <div class="date-number">18</div>
                        <div class="date-day">Пн</div>
                    </div>
                    <div class="date-item">
                        <div class="date-number">20</div>
                        <div class="date-day">Ср</div>
                    </div>
                    <div class="date-item active">
                        <div class="date-number">24</div>
                        <div class="date-day">Вс</div>
                        <div class="date-indicator">🔔</div>
                    </div>
                    <div class="date-item">
                        <div class="date-number">26</div>
                        <div class="date-day">Вт</div>
                    </div>
                    <div class="date-item">
                        <div class="date-number">30</div>
                        <div class="date-day">Сб</div>
                    </div>
                </div>
                <div class="section-card">
                    <p class="empty-state">Выберите дату</p>
                </div>
            </div>

            <!-- Клиенты -->
            <div class="tab-content" id="tabClients">
                <h1 class="page-title">Клиенты</h1>
                <div class="search-bar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <input type="text" placeholder="Поиск клиента...">
                </div>
                <div class="section-card">
                    <p class="empty-state">Список клиентов пуст</p>
                </div>
            </div>

            <!-- Программы -->
            <div class="tab-content" id="tabPrograms">
                <h1 class="page-title">Программы</h1>
                <div class="section-card">
                    <p class="empty-state">Нет созданных программ</p>
                </div>
            </div>
        </main>

        <nav class="bottom-nav">
            <button class="nav-btn active" data-tab="tabOverview">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7" rx="2"></rect>
                    <rect x="14" y="3" width="7" height="7" rx="2"></rect>
                    <rect x="3" y="14" width="7" height="7" rx="2"></rect>
                    <rect x="14" y="14" width="7" height="7" rx="2"></rect>
                </svg>
                <span>Общая</span>
            </button>
            <button class="nav-btn" data-tab="tabSchedule">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2"></rect>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                    <line x1="9" y1="4" x2="9" y2="10"></line>
                    <line x1="15" y1="4" x2="15" y2="10"></line>
                </svg>
                <span>Расписание</span>
            </button>
            <button class="add-btn" id="addBtn">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
            <button class="nav-btn" data-tab="tabClients">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <span>Клиенты</span>
            </button>
            <button class="nav-btn" data-tab="tabPrograms">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="12" y1="18" x2="12" y2="12"></line>
                    <line x1="9" y1="15" x2="15" y2="15"></line>
                </svg>
                <span>Программы</span>
            </button>
        </nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
